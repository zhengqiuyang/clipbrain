name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Unit tests (categorizer / store / searcher)
        run: npm test
      - name: Pipeline smoke
        run: npm run smoke:pipeline
